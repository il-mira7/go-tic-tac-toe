<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Pro Elite</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #6366f1;
            --text: #f1f5f9;
            --border: #334155;
            --x-color: #f43f5e;
            --o-color: #38bdf8;
            --cell-size: 100px; /* Фиксированный размер для стабильности */
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); color: var(--text);
            display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; overflow: hidden;
        }

        .app-container { 
            background: var(--panel); padding: 30px; border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            width: 400px; text-align: center; position: relative;
            border: 1px solid var(--border);
        }

        /* Клетки поля */
        .board { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            background: #334155; 
            padding: 12px; 
            border-radius: 16px; 
            margin: 20px 0; 
            width: 100%;
            box-sizing: border-box;
        }

        .cell { 
            background: #1e293b; 
            aspect-ratio: 1 / 1; /* Клетка всегда квадратная */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border-radius: 12px;
            position: relative;
        }

        /* Рисуем Крестик (X) */
        .cell.x::before, .cell.x::after {
            content: '';
            position: absolute;
            width: 10%;
            height: 70%;
            background-color: var(--x-color);
            border-radius: 5px;
        }
        .cell.x::before { transform: rotate(45deg); }
        .cell.x::after { transform: rotate(-45deg); }

        /* Рисуем Нолик (O) - крупный круг той же толщины */
        .cell.o::before {
            content: '';
            position: absolute;
            width: 60%;
            height: 60%;
            border: 8px solid var(--o-color); /* Толщина как у крестика */
            border-radius: 50%;
            box-sizing: border-box;
        }

        /* Остальные стили */
        input { 
            width: 100%; padding: 12px; margin: 8px 0; background: #0f172a;
            border: 1px solid var(--border); border-radius: 12px; color: white;
            box-sizing: border-box; outline: none;
        }

        button { 
            width: 100%; padding: 12px; background: var(--accent); color: white; 
            border: none; border-radius: 12px; font-weight: 600; cursor: pointer;
            margin: 6px 0;
        }

        #result-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.96); border-radius: 24px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
        }

        .games-list { 
            text-align: left; margin-top: 15px; max-height: 140px; 
            overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 10px;
        }
        .game-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .game-item button { width: auto; padding: 4px 12px; margin: 0; font-size: 11px; }

        .status-bar { font-size: 14px; font-weight: 600; padding: 10px; background: #334155; border-radius: 10px; margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="result-overlay" class="hidden">
        <div id="res-icon" style="font-size: 64px; margin-bottom: 10px;">🏆</div>
        <div id="res-title" style="font-size: 28px; font-weight: 800; margin-bottom: 5px;">ПОБЕДА!</div>
        <p id="res-desc" style="color: #94a3b8; margin-bottom: 25px;"></p>
        <button onclick="closeMatch()" style="width: 180px;">В меню</button>
    </div>

    <div id="auth-block">
        <h2 style="margin-top:0">Вход в игру</h2>
        <input type="text" id="login" placeholder="Логин">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <button onclick="register()" style="background:none; border: 1px solid var(--border)">Регистрация</button>
    </div>

    <div id="lobby-block" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span id="user-display" style="font-weight:700; color:var(--accent)"></span>
            <button onclick="location.reload()" style="width:auto; padding:5px 12px; background:#475569; font-size:11px;">Выйти</button>
        </div>
        <label style="font-size:14px; display:block; margin-bottom:10px; cursor:pointer">
            <input type="checkbox" id="vs-bot"> Против бота
        </label>
        <button onclick="createGame()">Новая игра</button>
        <button onclick="refreshGames()" style="background:#334155">Обновить список</button>
        <button onclick="showProfile()" style="background:#334155">Профиль</button>
        <button onclick="showHistory()" style="background:#334155">История игр</button>
        <button onclick="showLeaderboard()" style="background:#334155">Рейтинг</button>
        <div class="games-list" id="games-container"></div>
    </div>

    <div id="game-block" class="hidden">
        <div id="status-text" class="status-bar">Ожидание хода...</div>
        <div id="board" class="board"></div>
        <div style="font-size:10px; opacity:0.4" id="game-id-display"></div>
    </div>

    <div id="info-block" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="info-title" style="margin:0">Информация</h3>
            <button onclick="backToLobby()" style="width:auto; padding:5px 12px; background:#475569; font-size:11px;">Назад</button>
        </div>
        <div id="info-content" style="max-height:300px; overflow-y:auto; background:rgba(0,0,0,0.2); border-radius:12px; padding:15px;"></div>
    </div>
</div>

<script>
    let currentUser = null;
    let currentGameId = null;
    let gameOver = false;
    let boardData = [];
    let myRole = null;

    async function register() {
        const loginVal = document.getElementById('login').value;
        const passVal = document.getElementById('password').value;
        
        if (!loginVal || !passVal) {
            alert('Введите логин и пароль');
            return;
        }
        
        try {
            const res = await fetch('/signup', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: loginVal, password: passVal }) 
            });
            const data = await res.json();
            alert(data.message || data.error || 'Регистрация завершена');
        } catch (error) {
            console.error('Ошибка регистрации:', error);
            alert('Ошибка соединения с сервером');
        }
    }

    // Функция для декодирования JWT токена
    function parseJWT(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            console.error('Ошибка парсинга токена:', e);
            return null;
        }
    }

    async function login() {
        const loginVal = document.getElementById('login').value;
        const passVal = document.getElementById('password').value;
        
        try {
            const res = await fetch('/login', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: loginVal, password: passVal })
            });
            
            if (res.ok) {
                const data = await res.json();
                console.log('Login response:', data);
                
                const token = data.accessToken || data.access_token;
                if (!token) {
                    alert('Токен не получен от сервера');
                    return;
                }
                
                // Извлекаем user_id из токена
                const tokenPayload = parseJWT(token);
                const userId = tokenPayload ? tokenPayload.user_id : null;
                
                console.log('Token payload:', tokenPayload);
                
                currentUser = { 
                    uuid: userId || data.uuid || data.id || loginVal,
                    login: loginVal, 
                    authHeader: 'Bearer ' + token
                };
                
                console.log('Current user:', currentUser);
                
                document.getElementById('auth-block').classList.add('hidden');
                document.getElementById('lobby-block').classList.remove('hidden');
                document.getElementById('user-display').innerText = loginVal;
                refreshGames();
            } else { 
                const errorData = await res.json().catch(() => ({}));
                alert(errorData.message || "Ошибка входа"); 
            }
        } catch (error) {
            console.error('Ошибка при входе:', error);
            alert('Ошибка соединения с сервером');
        }
    }

    async function refreshGames() {
        if (!currentUser || !currentUser.authHeader) {
            console.error('Пользователь не авторизован');
            return;
        }
        
        try {
            const res = await fetch('/games/available', { 
                headers: { 'Authorization': currentUser.authHeader } 
            });
            
            if (!res.ok) {
                console.error('Ошибка получения списка игр:', res.status, res.statusText);
                return;
            }
            
            const games = await res.json();
            console.log('Полученные игры:', games);
            
            const container = document.getElementById('games-container');
            container.innerHTML = '';
            
            if (!games || games.length === 0) {
                container.innerHTML = '<div style="color:gray; font-size:12px; text-align:center; padding:10px;">Нет доступных игр</div>';
                return;
            }
            
            games.forEach(g => {
                if (g.player_x_id !== currentUser.uuid) {
                    const gameItem = document.createElement('div');
                    gameItem.className = 'game-item';
                    gameItem.innerHTML = `
                        <span>От: ${g.player_x_id ? g.player_x_id.substring(0,6) : 'Неизвестно'}</span>
                        <button onclick="joinGame('${g.game_id}')">Зайти</button>
                    `;
                    container.appendChild(gameItem);
                }
            });
        } catch (error) {
            console.error('Ошибка при обновлении списка игр:', error);
        }
    }

    async function createGame() {
        if (!currentUser || !currentUser.authHeader) {
            alert('Необходимо войти в систему');
            return;
        }
        
        console.log('Creating game with auth:', currentUser.authHeader); // Отладка
        
        try {
            const res = await fetch('/game/create', {
                method: 'POST',
                headers: { 
                    'Authorization': currentUser.authHeader, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ is_vs_bot: document.getElementById('vs-bot').checked })
            });
            
            console.log('Create game response status:', res.status); // Отладка
            
            if (res.ok) {
                const gameData = await res.json();
                console.log('Game created:', gameData);
                loadMatch(gameData);
            } else {
                const error = await res.json().catch(() => ({}));
                console.error('Create game error:', error);
                alert(error.message || 'Ошибка создания игры');
            }
        } catch (error) {
            console.error('Ошибка при создании игры:', error);
            alert('Ошибка создания игры');
        }
    }

    async function joinGame(id) {
        const res = await fetch(`/game/${id}/join`, { method: 'POST', headers: { 'Authorization': currentUser.authHeader } });
        if (res.ok) {
            const gameData = await (await fetch(`/game/${id}`, { headers: { 'Authorization': currentUser.authHeader } })).json();
            loadMatch(gameData);
        }
    }

    function loadMatch(data) {
        currentGameId = data.game_id;
        boardData = data.board;
        myRole = (data.player_x_id === currentUser.uuid) ? 1 : 2;
        document.getElementById('lobby-block').classList.add('hidden');
        document.getElementById('game-block').classList.remove('hidden');
        renderBoard();
        updateStatus(data);
        if (!gameOver) setTimeout(() => poll(currentGameId), 2000);
    }

    async function poll(id) {
        if (gameOver || currentGameId !== id) return;
        const res = await fetch(`/game/${id}`, { headers: { 'Authorization': currentUser.authHeader } });
        if (res.ok) {
            const data = await res.json();
            boardData = data.board;
            renderBoard();
            updateStatus(data);
            if (!gameOver) setTimeout(() => poll(id), 2000);
        }
    }

    function renderBoard() {
        const b = document.getElementById('board');
        b.innerHTML = '';
        boardData.forEach((row, r) => {
            row.forEach((cell, c) => {
                const div = document.createElement('div');
                // Теперь мы не пишем текст, а просто ставим класс x или o
                div.className = 'cell' + (cell === 1 ? ' x' : cell === 2 ? ' o' : '');
                div.onclick = () => makeMove(r, c);
                b.appendChild(div);
            });
        });
    }

    async function makeMove(r, c) {
        if (gameOver) return;
        try {
            const res = await fetch(`/game/${currentGameId}`, { 
                method: 'POST',
                headers: { 'Authorization': currentUser.authHeader, 'Content-Type': 'application/json' },
                body: JSON.stringify({ row: r, col: c, board: boardData })
            });
            if (res.ok) {
                const gameData = await res.json();
                loadMatch(gameData);
            } else {
                const error = await res.json().catch(() => ({}));
                console.error('Ошибка хода:', error.message);
            }
        } catch (error) {
            console.error('Ошибка при выполнении хода:', error);
        }
    }

    function updateStatus(data) {
        const sText = document.getElementById('status-text');
        const overlay = document.getElementById('result-overlay');
        const status = data.status || "";
        sText.innerText = status;

        const isWin = status.toLowerCase().includes("wins");
        const isDraw = status.toLowerCase().includes("draw");

        if (isWin || isDraw) {
            gameOver = true;
            overlay.classList.remove('hidden');
            document.getElementById('res-desc').innerText = status;
            
            const rTitle = document.getElementById('res-title');
            const rIcon = document.getElementById('res-icon');
            
            if (isDraw) {
                rTitle.innerText = "НИЧЬЯ";
                rTitle.style.color = "#fbbf24";
                rIcon.innerText = "🤝";
            } else {
                const xWon = status.toLowerCase().includes("player x");
                const win = (xWon && myRole === 1) || (!xWon && myRole === 2);
                rTitle.innerText = win ? "ПОБЕДА!" : "ПОРАЖЕНИЕ";
                rTitle.style.color = win ? "#22c55e" : "#f43f5e";
                rIcon.innerText = win ? "🏆" : "💀";
            }
        }
    }

    function closeMatch() {
        gameOver = false;
        currentGameId = null;
        document.getElementById('result-overlay').classList.add('hidden');
        document.getElementById('game-block').classList.add('hidden');
        document.getElementById('lobby-block').classList.remove('hidden');
        refreshGames();
    }

    async function showProfile() {
        try {
            const res = await fetch('/user/me', {
                headers: { 'Authorization': currentUser.authHeader }
            });
            if (res.ok) {
                const user = await res.json();
                document.getElementById('info-title').innerText = 'Профиль';
                document.getElementById('info-content').innerHTML = `
                    <div style="text-align:left;">
                        <p><strong>ID:</strong> ${user.id}</p>
                        <p><strong>Логин:</strong> ${user.login}</p>
                        <p><strong>Дата регистрации:</strong> ${user.created_at}</p>
                    </div>
                `;
                showInfoBlock();
            }
        } catch (error) {
            console.error('Ошибка получения профиля:', error);
        }
    }

    async function showHistory() {
        try {
            const res = await fetch('/games/history', {
                headers: { 'Authorization': currentUser.authHeader }
            });
            if (res.ok) {
                const games = await res.json();
                document.getElementById('info-title').innerText = 'История игр';
                let content = '';
                if (games.length === 0) {
                    content = '<p style="text-align:center; color:gray;">Нет сыгранных игр</p>';
                } else {
                    games.forEach(game => {
                        const isWinner = game.winner_id === currentUser.uuid;
                        const isDraw = game.status.includes('Draw');
                        const resultColor = isDraw ? '#fbbf24' : (isWinner ? '#22c55e' : '#f43f5e');
                        const resultText = isDraw ? 'Ничья' : (isWinner ? 'Победа' : 'Поражение');
                        content += `
                            <div style="border-bottom:1px solid #334155; padding:8px 0;">
                                <div style="display:flex; justify-content:space-between;">
                                    <span>Игра: ${game.game_id.substring(0,8)}...</span>
                                    <span style="color:${resultColor}; font-weight:bold;">${resultText}</span>
                                </div>
                                <div style="font-size:12px; color:#94a3b8;">${game.status}</div>
                            </div>
                        `;
                    });
                }
                document.getElementById('info-content').innerHTML = content;
                showInfoBlock();
            }
        } catch (error) {
            console.error('Ошибка получения истории:', error);
        }
    }

    async function showLeaderboard() {
        try {
            const res = await fetch('/games/leaders?n=10', {
                headers: { 'Authorization': currentUser.authHeader }
            });
            
            document.getElementById('info-title').innerText = 'Рейтинг игроков';
            
            if (res.ok) {
                const leaders = await res.json();
                console.log('Leaderboard data:', leaders);
                
                let content = '';
                if (!leaders || leaders.length === 0) {
                    content = '<p style="text-align:center; color:gray;">Нет данных о рейтинге</p>';
                } else {
                    leaders.forEach((leader, index) => {
                        const place = index + 1;
                        const medal = place === 1 ? '🥇' : place === 2 ? '🥈' : place === 3 ? '🥉' : `${place}.`;
                        const winRatio = leader.WinRatio || leader.win_ratio || 0;
                        const login = leader.Login || leader.login || 'Неизвестно';
                        content += `
                            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #334155;">
                                <div>
                                    <span style="margin-right:8px;">${medal}</span>
                                    <span>${login}</span>
                                </div>
                                <span style="color:#6366f1; font-weight:bold;">${(winRatio * 100).toFixed(1)}%</span>
                            </div>
                        `;
                    });
                }
                document.getElementById('info-content').innerHTML = content;
            } else {
                console.error('Leaderboard request failed:', res.status, res.statusText);
                const errorData = await res.json().catch(() => ({}));
                console.error('Error details:', errorData);
                document.getElementById('info-content').innerHTML = `
                    <p style="text-align:center; color:#f43f5e;">
                        Ошибка сервера (${res.status})<br>
                        <small>Попробуйте позже</small>
                    </p>
                `;
            }
            
            showInfoBlock();
        } catch (error) {
            console.error('Ошибка при получении рейтинга:', error);
            document.getElementById('info-title').innerText = 'Рейтинг игроков';
            document.getElementById('info-content').innerHTML = `
                <p style="text-align:center; color:#f43f5e;">
                    Ошибка соединения<br>
                    <small>Проверьте интернет</small>
                </p>
            `;
            showInfoBlock();
        }
    }

    function showInfoBlock() {
        document.getElementById('lobby-block').classList.add('hidden');
        document.getElementById('info-block').classList.remove('hidden');
    }

    function backToLobby() {
        document.getElementById('info-block').classList.add('hidden');
        document.getElementById('lobby-block').classList.remove('hidden');
    }
</script>
</body>
</html>
