<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Go Project 2026</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; background-color: #333; padding: 10px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .cell { width: 100px; height: 100px; background-color: #fff; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .cell:hover { background-color: #e9ecef; }
        .cell.x { color: #ff4d4d; }
        .cell.o { color: #4d79ff; }
        .cell.disabled { cursor: not-allowed; opacity: 0.8; }
        
        #status-display { margin-top: 20px; padding: 12px 24px; border-radius: 30px; font-size: 18px; font-weight: 600; transition: 0.3s; }
        .status-ongoing { color: #555; background: #eee; }
        .status-win { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-loss { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-draw { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        
        .controls { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; background-color: #007bff; color: white; cursor: pointer; font-weight: 600; box-shadow: 0 4px 6px rgba(0,123,255,0.2); }
        button:hover { background-color: #0056b3; }
        small { color: #888; }
    </style>
</head>
<body>
    <h1>Tic-Tac-Toe Go</h1>
    
    <div id="board" class="board"></div>
    
    <div id="status-display" class="status-ongoing">Ваш ход (X)</div>
    
    <div class="controls">
        <button onclick="resetGame()">Начать новую игру</button>
        <small id="game-id-label"></small>
    </div>

    <script>
        // Функция генерации уникального ID для каждой новой игры
        function generateUUID() {
            return 'game-' + Math.random().toString(36).substr(2, 9);
        }

        let gameId = generateUUID();
        let gameOver = false;
        let currentBoard = [
            [0, 0, 0],
            [0, 0, 0],
            [0, 0, 0]
        ];

        function render() {
            const boardDiv = document.getElementById('board');
            const idLabel = document.getElementById('game-id-label');
            boardDiv.innerHTML = '';
            idLabel.innerText = `ID игры: ${gameId}`;

            currentBoard.forEach((row, r) => {
                row.forEach((cell, c) => {
                    const div = document.createElement('div');
                    div.className = 'cell';
                    if (gameOver) div.classList.add('disabled');
                    
                    if (cell === 1) { 
                        div.innerText = 'X'; 
                        div.classList.add('x'); 
                    } else if (cell === 2) { 
                        div.innerText = 'O'; 
                        div.classList.add('o'); 
                    }
                    
                    div.onclick = () => makeMove(r, c);
                    boardDiv.appendChild(div);
                });
            });
        }

        async function makeMove(row, col) {
            // Если игра окончена или клетка занята — игнорируем клик
            if (gameOver || currentBoard[row][col] !== 0) return;

            const requestData = {
                board: currentBoard,
                row: row,
                col: col
            };

            try {
                //const response = await fetch(`http://localhost:8080/game/${gameId}`, {
                const response = await fetch(`/game/${gameId}`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Обновляем состояние из ответа бэкенда
                    currentBoard = data.board;
                    
                    //  статус должен совпадать с тем, что возвращает Go сервис (.String())
                    handleGameStatus(data.status);
                    
                    render();
                } else {
                    const err = await response.json();
                    alert(err.message || "Ошибка хода");
                }
            } catch (error) {
                console.error("Fetch error:", error);
                alert("Ошибка связи с сервером. Проверьте CORS!");
            }
        }

        function handleGameStatus(status) {
            const display = document.getElementById('status-display');
            
            if (status === "Ongoing") {
                display.innerText = "Ваш ход (X)";
                display.className = "status-ongoing";
            } else {
                gameOver = true; // Блокируем дальнейшие ходы
                
                if (status === "Player 1 Wins") {
                    display.innerText = "Вы победили! 🎉";
                    display.className = "status-win";
                } else if (status === "Computer Wins") {
                    display.innerText = "Робот победил 🤖";
                    display.className = "status-loss";
                } else if (status === "Draw") {
                    display.innerText = "Ничья! 🤝";
                    display.className = "status-draw";
                }
            }
        }

        function resetGame() {
            // новый ID при каждом сбросе
            gameId = generateUUID();
            gameOver = false;
            currentBoard = [
                [0, 0, 0],
                [0, 0, 0],
                [0, 0, 0]
            ];
            
            const display = document.getElementById('status-display');
            display.innerText = "Ваш ход (X)";
            display.className = "status-ongoing";
            
            render();
            console.log("Новая игра запущена:", gameId);
        }

        // Инициализация при загрузке страницы
        render();
    </script>
</body>
</html>
